[pytest]
testpaths = bomba_infusion_pdevs/tests
pythonpath = bomba_infusion_pdevs
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Tests unitarios de componentes atómicos
    controlled: Escenarios controlados con monkey-patching
    stochastic: Escenarios estocásticos sin intervención
    properties: Verificación de propiedades safety/liveness/temporal
    faults: Escenarios de inyección de fallas deliberadas
log_cli = true
log_cli_level = INFO
log_format = %(message)s
